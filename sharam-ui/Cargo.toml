[package]
name = "sharam-ui"
version.workspace = true
authors = ["Darwin Subramaniam <darwinsubramaniam@gmail.com>"]
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router"] }
chrono = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
# WASM-target reqwest uses the browser's fetch under the hood; native TLS
# features (rustls/http2) from the workspace dep don't apply, so override
# locally with the minimal feature set.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
web-sys = { version = "0.3", features = ["Window", "Storage", "Location"] }
charming = { workspace = true }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
