[application]

[web.app]

# HTML title tag content
title = "Sharam — Cooperative Capital Ledger"

# include `assets` in web platform
[web.resource]

# Additional CSS style files
style = [
    "https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap",
]

# Additional JavaScript files
script = [
    "https://accounts.google.com/gsi/client",
    # ECharts runtime — required by `charming` 0.6 with the `wasm` feature.
    # `WasmRenderer::render(id, &chart)` calls window.echarts.init(...) so
    # this script must load before any chart component mounts.
    "https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js",
]

# Forward /api/* to the local gateway so the frontend stays same-origin.
[[web.proxy]]
backend = "http://127.0.0.1:3000/api"

[web.resource.dev]

# Javascript code file
# serve: [dev-server] only
script = []
